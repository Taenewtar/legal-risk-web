<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบวิเคราะห์ความเสี่ยงทางกฎหมาย (Criminal Legal Risk Engine)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800">⚖️ ระบบวิเคราะห์ความเสี่ยงทางกฎหมายอาญา</h1>
            <p class="text-gray-500 text-sm mt-2">ตรวจสอบและประมวลผลความเสี่ยงข้อความภาษาไทย ฐานหมิ่นประมาทและดูหมิ่น</p>
        </div>

        <!-- Input Section -->
        <div class="space-y-4">
            <label class="block font-medium text-gray-700">📥 กรอกข้อความที่ต้องการตรวจสอบ:</label>
            <textarea id="inputText" rows="4" class="w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" placeholder="พิมพ์หรือวางข้อความภาษาไทยที่นี่..."></textarea>

            <div class="flex gap-3">
                <button onclick="checkRisk()" id="btnSubmit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl shadow transition">🔍 เริ่มวิเคราะห์ข้อความ</button>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="hidden text-center my-8 py-4">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
            <p class="text-indigo-600 font-medium mt-2">กำลังวิเคราะห์องค์ประกอบความผิดด้วย AI...</p>
        </div>

        <!-- Output Section -->
        <div id="resultArea" class="hidden mt-8 border-t pt-6 space-y-4">
            <h2 class="text-xl font-bold text-gray-800">📊 ผลการวิเคราะห์ทางกฎหมาย:</h2>
            <div id="outputContainer" class="p-5 rounded-xl bg-gray-50 border border-gray-200 text-gray-700 leading-relaxed space-y-2"></div>
        </div>
    </div>

    <script>
        async function checkRisk() {
            const text = document.getElementById('inputText').value.trim();
            if(!text) { alert('กรุณากรอกข้อความก่อนเปิดใช้งานครับ'); return; }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultArea').classList.add('hidden');

            try {
                // ⚠️ แก้ไข URL นี้เป็น Space URL ของคุณที่สร้างใน Hugging Face
                const response = await fetch('https://your-space-name.hf.space/call/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: [text] })
                });
                const result = await response.json();

                document.getElementById('outputContainer').innerHTML = result.data[0];
                document.getElementById('resultArea').classList.remove('hidden');
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อกับ Server กรุณาลองใหม่อีกครั้ง');
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
